<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kartenzahlung</title>
<style>
  :root{
    --bg:#08090b; --face:#16181d; --edge:#23262d; --ink:#fff;
    --dim:#7d8592; --line:#2b2f37; --go:#2ecc71; --go-dim:#1d6b3f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#14161b 0%,var(--bg) 70%);
    color:var(--ink);font:400 16px/1.4 -apple-system,"SF Pro Text",Inter,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .term{width:min(94vw,520px);background:var(--face);border:1px solid var(--edge);
    border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.65)}
  .top{display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
  .shop{display:flex;align-items:center;gap:9px;letter-spacing:.01em}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 0 4px rgba(46,204,113,.15)}
  .body{padding:34px 26px 30px;text-align:center}
  .label{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .amount{font:600 76px/1 -apple-system,"SF Pro Display",Inter,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:10px 0 4px}
  .items{color:var(--dim);font-size:15px}
  .reader{margin:30px auto 8px;width:132px;height:132px;display:grid;place-items:center;position:relative}
  .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
  .wave{position:absolute;inset:0;border-radius:50%;border:2px solid var(--go-dim);
    opacity:0;animation:pulse 2.4s ease-out infinite}
  .wave:nth-child(3){animation-delay:.8s}.wave:nth-child(4){animation-delay:1.6s}
  @keyframes pulse{0%{transform:scale(.62);opacity:.85}100%{transform:scale(1.18);opacity:0}}
  .hint{color:var(--dim);font-size:15px;min-height:22px}
  .foot{border-top:1px solid var(--line);padding:14px 22px;display:flex;
    justify-content:space-between;font-size:12px;color:#565c66;letter-spacing:.06em}
  .ok .wave{animation:none;opacity:0}
  .ok .ring{border-color:var(--go)}
  .ok .hint{color:var(--go)}
  .card{font-variant-numeric:tabular-nums}
  svg{display:block}
</style></head>
<body>
  <div class="term" id="term">
    <div class="top">
      <span class="shop"><span class="dot"></span> REWE Köpenicker Straße</span>
      <span id="mode">Kartenzahlung</span>
    </div>
    <div class="body">
      <div class="label">Zu zahlen</div>
      <div class="amount" id="amount">38,40 €</div>
      <div class="items">Druckerpapier, Toner, Ordner</div>
      <div class="reader">
        <span class="ring"></span><span class="wave"></span><span class="wave"></span>
        <span id="glyph">
          <svg width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">
            <path d="M14 14c8.8 6 8.8 18 0 24" stroke="#9aa3b0" stroke-width="3" stroke-linecap="round"/>
            <path d="M23 10c12 8.5 12 23.5 0 32" stroke="#9aa3b0" stroke-width="3" stroke-linecap="round"/>
            <path d="M32 6c15.5 11 15.5 29 0 40" stroke="#9aa3b0" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
      </div>
      <div class="hint" id="hint">Telefon an das Lesegerät halten</div>
    </div>
    <div class="foot"><span id="brand">Partnerhändler</span><span class="card">Terminal 4821</span></div>
  </div>
<script>
  const API = new URLSearchParams(location.search).get("api") || "";
  const term = document.getElementById("term");
  const check = '<svg width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">'
    + '<path d="M13 27l9.5 9.5L39 18" stroke="#2ecc71" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let done = false;

  function approve(){
    if (done) return;
    done = true;
    term.classList.add("ok");
    document.getElementById("glyph").innerHTML = check;
    document.getElementById("hint").textContent = "Zahlung angenommen, Visa 4821";
    document.getElementById("mode").textContent = "Beleg gesendet";
    fetch(API + "/v1/events/transaction", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({merchant:"REWE", amount:38.40, card:"Business Visa •• 4821",
        category:"Office supplies", purpose:"business", receipt_status:"ok", partner:true})
    }).catch(function(){});
  }

  if (API) document.getElementById("brand").textContent = "Partnerhändler, Beleg digital";
  document.body.addEventListener("click", approve);
  document.body.addEventListener("touchstart", approve, {passive:true});
</script>
</body></html>
